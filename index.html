<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <title>Phiếu khảo sát từ Khách Sạn của chúng tôi.</title>
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
    <section>
        <h1>Phiếu khảo sát từ Khách Sạn.</h1>
        <p>Cảm ơn các bạn vì đã sử dụng dịch vụ trong khách sạn của chúng tôi. Chúng tôi luôn chào đón các bạn trở lại!</p>
    <form action="Thông tin.html">
        <fieldset>
            <legend>Các mục</legend>
            <nav aria-hidden="true">
            <!--Các links dẫn đến các mục đánh giá ở đây-->
            </nav>
        </fieldset>
    </form>
    </section>
        <h2>1. Thông tin cá nhân</h2>
        <form action="Thông tin.html">
        <fieldset>
            <legend>Thông tin cá nhân</legend>
            <div id="personal-info-fields"></div>
        </fieldset>
        <h2>2. Các mục chính</h2>
        <fieldset>
            <legend>Các mục cần đánh giá</legend>
            <section>
                <label id="đặt-phòng" for="đặt-phòng">Trải nghiệm đặt phòng của bạn như nào?</label>
                <span id="rating-booking"></span>
            </section>
            <div id="experience-booking"></div>
            <section>
                <label id="thức-ăn" for="thức-ăn">Trải nghiệm ăn uống của bạn như nào?</label>
                <span id="rating-food"></span>
            </section>
            <div id="experience-food"></div>
        </fieldset>
<br>
<hr>
        <table id="tiện-nghi">
            <thead>
                <caption>Tiện nghi khách sạn</caption>
            </thead>
            <tbody id="amenity-table-body">
            </tbody>
        </table>
<hr>
        </form>
    </body>
    <script src="js/utilities.js"></script>
    <script>
    (function () {
        // 1. Personal info fields - generated via shared utility
        var personalInfoContainer = document.getElementById('personal-info-fields');
        var personalFields = [
            { id: 'tên', labelText: 'Tên của bạn:', inputType: 'text', name: 'tên', placeholder: 'Lê Thái Dũng', required: true },
            { id: 'tuổi', labelText: 'Tuổi của bạn:', inputType: 'number', name: 'tuổi', placeholder: '25', min: 10, max: 100, required: true }
        ];
        personalFields.forEach(function (fieldConfig) {
            personalInfoContainer.appendChild(createFormField(fieldConfig));
        });
        personalInfoContainer.appendChild(createGenderSelect('giới-tính', ['Nam', 'Nữ', 'Khác']));

        // 2. Rating selects - generated via shared utility
        document.getElementById('rating-booking').appendChild(createRatingSelect('đồ-ăn', 'Tốt'));
        document.getElementById('rating-food').appendChild(createRatingSelect('thức-ăn', 'Tốt'));

        // 3. Experience description fieldsets - generated via shared utility
        document.getElementById('experience-booking').appendChild(
            createExperienceFieldset(
                'Nếu bạn thấy khó khăn trong việc đặt phòng, hãy mô tả nó vào ô trống bên dưới:',
                'khó-đặt-phòng',
                'Trải nghiệm đặt phòng'
            )
        );
        document.getElementById('experience-food').appendChild(
            createExperienceFieldset(
                'Nếu bạn thấy khó khăn trong ăn uống, hãy mô tả nó vào ô trống bên dưới:',
                'khó-ăn-uống',
                'Trải nghiệm ăn uống'
            )
        );

        // 4. Amenity rating table - generated via shared utility
        var amenities = [
            { label: 'Phòng ngủ', name: 'chất lượng phòng ngủ' },
            { label: 'Phòng khách', name: 'chất lượng phòng khách' },
            { label: 'Hồ bơi', name: 'chất lượng hồ bơi' },
            { label: 'Suối nước nóng', name: 'chất lượng suối nước nóng' },
            { label: 'Phòng gym', name: 'chất lượng phòng gym' },
            { label: 'Thiên nhiên', name: 'chất lượng thiên nhiên' }
        ];
        var tbody = document.getElementById('amenity-table-body');
        tbody.appendChild(createAmenityHeaderRow());
        amenities.forEach(function (amenity) {
            tbody.appendChild(createAmenityRow(amenity.label, amenity.name));
        });
    })();
    </script>
</html>
