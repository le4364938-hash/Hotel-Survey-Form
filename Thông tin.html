<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <title>Kết quả khảo sát</title>
        <style>
            .success-banner {
                background: #e8f5e9;
                color: #1b5e20;
                border: 1px solid #a5d6a7;
                padding: 12px 16px;
                border-radius: 4px;
                margin-bottom: 16px;
            }
            .error-banner {
                background: #fdecea;
                color: #611a15;
                border: 1px solid #f5c6cb;
                padding: 12px 16px;
                border-radius: 4px;
                margin-bottom: 16px;
            }
            table { border-collapse: collapse; margin-top: 12px; }
            th, td { border: 1px solid #ccc; padding: 6px 12px; text-align: left; }
            th { background: #f5f5f5; }
        </style>
    </head>
    <body>
        <h1>Kết quả khảo sát</h1>
        <div id="status"></div>
        <div id="results"></div>
        <p><a href="index.html">Quay lại phiếu khảo sát</a></p>

        <script>
        (function () {
            var statusEl = document.getElementById('status');
            var resultsEl = document.getElementById('results');

            var params = new URLSearchParams(window.location.search);

            var labels = {
                'ten': 'Tên',
                'tuoi': 'Tuổi',
                'gioi-tinh': 'Giới tính',
                'dat-phong': 'Đánh giá đặt phòng',
                'kho-dat-phong': 'Chi tiết đặt phòng',
                'thuc-an': 'Đánh giá ăn uống',
                'kho-an-uong': 'Chi tiết ăn uống',
                'chat-luong-phong-ngu': 'Phòng ngủ',
                'chat-luong-phong-khach': 'Phòng khách',
                'chat-luong-ho-boi': 'Hồ bơi',
                'chat-luong-suoi-nuoc-nong': 'Suối nước nóng',
                'chat-luong-phong-gym': 'Phòng gym',
                'chat-luong-thien-nhien': 'Thiên nhiên'
            };

            var requiredFields = ['ten', 'tuoi', 'gioi-tinh', 'dat-phong', 'thuc-an'];

            var hasAnyData = false;
            var entries = [];
            for (var key in labels) {
                var val = params.get(key);
                if (val && val.trim()) {
                    hasAnyData = true;
                    entries.push({ label: labels[key], value: val.trim() });
                }
            }

            if (!hasAnyData) {
                statusEl.innerHTML = '<div class="error-banner">' +
                    '<strong>Lỗi:</strong> Không nhận được dữ liệu khảo sát. ' +
                    'Vui lòng điền phiếu khảo sát và nhấn "Gửi khảo sát".' +
                    '</div>';
                return;
            }

            var missing = [];
            for (var i = 0; i < requiredFields.length; i++) {
                var val = params.get(requiredFields[i]);
                if (!val || !val.trim()) {
                    missing.push(labels[requiredFields[i]]);
                }
            }

            if (missing.length > 0) {
                statusEl.innerHTML = '<div class="error-banner">' +
                    '<strong>Cảnh báo:</strong> Thiếu thông tin bắt buộc: ' +
                    missing.join(', ') + '. Một số câu trả lời có thể không được ghi nhận.' +
                    '</div>';
            } else {
                statusEl.innerHTML = '<div class="success-banner">' +
                    '<strong>Cảm ơn bạn!</strong> Phiếu khảo sát đã được gửi thành công.' +
                    '</div>';
            }

            var html = '<table><thead><tr><th>Mục</th><th>Câu trả lời</th></tr></thead><tbody>';
            for (var i = 0; i < entries.length; i++) {
                html += '<tr><td>' + escapeHtml(entries[i].label) + '</td><td>' + escapeHtml(entries[i].value) + '</td></tr>';
            }
            html += '</tbody></table>';
            resultsEl.innerHTML = html;

            function escapeHtml(str) {
                var div = document.createElement('div');
                div.appendChild(document.createTextNode(str));
                return div.innerHTML;
            }
        })();
        </script>
    </body>
</html>
